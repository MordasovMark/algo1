<title>מסע האלגוריתמים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap">
<style>
/* Layout: one winding path per island, islands stacked down a single column; level, XP and streak pinned in a sticky bar. */
:root{
  --bg:#e8f3f1; --surface:#ffffff; --surface2:#f3f9f8; --ink:#0f2a3f; --ink2:#486174; --line:#c9dddb;
  --brand:#0b7f86; --brand-ink:#ffffff; --sun:#f2b100; --sun-ink:#3b2a00;
  --good:#1b8f50; --bad:#cf3f3f; --warn:#b86e00; --locked:#a9bcc4;
  --c-sky:#2f80d1; --c-emerald:#1f9d6b; --c-violet:#7a5ad1; --c-amber:#d98a00; --c-rose:#d6456b; --c-slate:#5f7385;
  --shadow:0 1px 0 rgba(15,42,63,.06),0 6px 18px rgba(15,42,63,.08);
  --f-display:'Secular One','Rubik',system-ui,sans-serif;
  --f-body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-code:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09192a; --surface:#10283b; --surface2:#0d2133; --ink:#e7f2f6; --ink2:#9db5c4; --line:#22425a;
  --brand:#3cc4c9; --brand-ink:#04222a; --sun:#ffc933; --sun-ink:#3b2a00;
  --good:#4cc98a; --bad:#ff8080; --warn:#f0b04a; --locked:#3a5468;
  --c-sky:#5aa5f0; --c-emerald:#3dc891; --c-violet:#9c86f0; --c-amber:#f0ae2e; --c-rose:#f0698d; --c-slate:#8aa0b2;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09192a; --surface:#10283b; --surface2:#0d2133; --ink:#e7f2f6; --ink2:#9db5c4; --line:#22425a;
  --brand:#3cc4c9; --brand-ink:#04222a; --sun:#ffc933; --sun-ink:#3b2a00;
  --good:#4cc98a; --bad:#ff8080; --warn:#f0b04a; --locked:#3a5468;
  --c-sky:#5aa5f0; --c-emerald:#3dc891; --c-violet:#9c86f0; --c-amber:#f0ae2e; --c-rose:#f0698d; --c-slate:#8aa0b2;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:640px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink);box-shadow:0 3px 0 rgba(0,0,0,.22);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.chip.draft{border-style:dashed}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.bar-in{max-width:640px;margin-inline:auto;display:flex;align-items:center;gap:12px}
.lvl{width:46px;height:46px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.35rem;flex:none}
.xpbox{flex:1;min-width:0}
.xprow{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--ink2);font-weight:500}
.xprow b{color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:.95rem}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.track i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 10px;font-weight:700;display:flex;align-items:center;gap:6px;flex:none;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}

/* hero */
.hero{padding-block:22px 6px}
.hero h1{font-size:clamp(1.9rem,7vw,2.6rem)}
.hero p{margin:6px 0 0;color:var(--ink2);max-width:46ch}

/* quests */
.quests{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-block:16px 8px}
.quest{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.quest b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.quest span{font-size:.85rem;color:var(--ink2)}
.quest.hot{border-color:var(--sun)}
.quest.done{opacity:.7}

/* islands */
.island{margin-top:34px}
.ihead{display:flex;gap:12px;align-items:center;background:var(--ic);color:var(--brand-ink);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.ihead .wk{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.92;font-weight:700}
.ihead h2{font-size:1.45rem;color:var(--brand-ink)}
.ihead .pr{margin-inline-start:auto;text-align:end;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ihead .mini{display:block;height:6px;width:84px;background:rgba(127,127,127,.35);border-radius:9px;margin-top:5px;margin-inline-start:auto;overflow:hidden}
.ihead .mini i{display:block;height:100%;background:var(--brand-ink)}
.path{position:relative;container-type:inline-size;max-width:420px;margin-inline:auto;margin-top:6px}
.path>svg{display:block;width:100%;height:auto}
.stop{position:absolute;transform:translate(-50%,-50%);width:17cqw;height:17cqw;border:0;background:none;padding:0;overflow:visible;border-radius:50%}
.disc{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--ic) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;box-shadow:var(--shadow)}
.core{width:82%;height:82%;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-code);font-weight:700;font-size:4.3cqw;color:var(--ic);letter-spacing:-.02em}
.stop.done .core{background:var(--ic);color:var(--brand-ink)}
.stop.locked .disc{background:var(--line);box-shadow:none}
.stop.locked .core{background:var(--surface2);color:var(--locked);border:2px dashed var(--locked)}
.stop.next .disc{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.stars{position:absolute;left:50%;top:calc(100% - 1.2cqw);transform:translateX(-50%);display:flex;gap:.2cqw;font-size:3.6cqw;line-height:1;background:var(--surface);border-radius:99px;padding:.6cqw 1.6cqw;border:1px solid var(--line);color:var(--sun);white-space:nowrap}
.stars .off{color:var(--line)}
.lbl{position:absolute;left:-6.5cqw;width:30cqw;top:calc(100% + 2.8cqw);text-align:center;font-size:max(11px,3.5cqw);font-weight:700;line-height:1.2;color:var(--ink)}
.stop.locked .lbl{color:var(--ink2)}
.tag{position:absolute;left:50%;top:-7.5cqw;transform:translateX(-50%);background:var(--sun);color:var(--sun-ink);font-weight:700;font-size:3.2cqw;padding:.6cqw 2.4cqw;border-radius:99px;white-space:nowrap}
.tag:after{content:"";position:absolute;left:50%;bottom:-1.2cqw;width:2cqw;height:2cqw;background:var(--sun);transform:translateX(-50%) rotate(45deg)}
.stop.boss{width:21cqw;height:21cqw;border-radius:0}
.stop.boss .disc{border-radius:0;clip-path:polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%);box-shadow:none}
.stop.boss .core{border-radius:0;clip-path:polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%);width:86%;height:86%;font-size:3.8cqw;background:var(--ic);color:var(--brand-ink)}
.stop.boss.locked .core{background:var(--surface2);color:var(--locked);border:0}
.stop.boss .lbl{left:-4.5cqw;top:calc(100% + 2.4cqw)}

.wave{display:block;width:100%;height:28px;color:var(--line);margin-top:6px}

/* overlay (sheet / modal) */
.scrim{position:fixed;inset:0;background:rgba(5,16,26,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.modal{max-height:92%}
.shead{display:flex;gap:12px;align-items:center;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.shead .core2{width:52px;height:52px;border-radius:50%;background:var(--ic);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-code);font-weight:700;font-size:.95rem;flex:none}
.shead h2{font-size:1.35rem}
.xbtn{margin-inline-start:auto;border:2px solid var(--line);background:var(--surface2);width:40px;height:40px;border-radius:12px;font-size:1.1rem;flex:none}
.sbody{overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}
.sbody p{margin:0}
.warn{background:var(--surface2);border:2px dashed var(--warn);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:.92rem}
.lcl{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.lc{border:2px solid var(--line);border-radius:14px;background:var(--surface2)}
.lc.on{border-color:var(--good)}
.lc-top{display:flex;gap:10px;align-items:center;padding:10px 12px}
.lc-top input{width:22px;height:22px;accent-color:var(--good);flex:none}
.lc-top label{flex:1;min-width:0;font-weight:500}
.lc-top .num{font-family:var(--f-code);color:var(--ink2);font-size:.85rem}
.lc-vid{padding:0 12px 10px;display:flex;flex-wrap:wrap;gap:8px}
.vbtn{border:2px solid var(--ic);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 12px;font-weight:700}
.vcells.wide .vcw{width:auto;min-width:48px}.vcells.wide .vc{padding-inline:8px;white-space:nowrap}
.vtri{display:flex;flex-direction:column;align-items:center;gap:4px}.vtr{display:flex;gap:4px}.vtr .vc{width:34px}
.vid{display:inline-flex;gap:6px;align-items:center;font-weight:700;text-decoration:none;border:2px solid var(--brand);border-radius:12px;padding:6px 12px;background:var(--surface);color:var(--ink)}
.vid.alt{border-color:var(--line);font-weight:500;color:var(--ink2)}
.lc details{padding:0 12px 10px;font-size:.92rem;color:var(--ink2)}
.lc summary{cursor:pointer;color:var(--brand);font-weight:700}
.lc details p{margin-top:6px}
.sub{font-family:var(--f-display);font-size:1.05rem}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;padding-block:14px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:10px;border-radius:9px;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--sun)}
.timer{font-family:var(--f-code);font-weight:700;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:center}
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-top:10px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stem{font-size:1.08rem;margin:0 0 14px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 14px;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--surface)}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--brand);box-shadow:0 3px 0 var(--brand)}
.opt.sel .k{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.opt.right{border-color:var(--good);box-shadow:0 3px 0 var(--good);background:var(--surface)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);background:var(--surface)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;border:2px solid var(--line);position:relative}
.fb.ok{border-color:var(--good)}.fb.no{border-color:var(--bad)}
.fb h3{font-size:1.2rem;margin-bottom:4px}
.fb.ok h3{color:var(--good)}.fb.no h3{color:var(--bad)}
.fb p{margin:0;color:var(--ink)}
.gain{position:absolute;inset-inline-end:12px;top:-14px;background:var(--sun);color:var(--sun-ink);font-weight:700;border-radius:99px;padding:2px 12px;animation:pop .6s ease-out both}
@keyframes pop{from{transform:translateY(10px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:130px}

/* results */
.res{text-align:center;padding-block:28px 8px}
.res h1{font-size:2rem}
.big{font-family:var(--f-display);font-size:3.4rem;line-height:1;margin-block:10px;font-variant-numeric:tabular-nums}
.rlist{display:flex;flex-direction:column;gap:8px;margin-top:14px;text-align:start}
.rlist details{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px}
.rlist summary{cursor:pointer;font-weight:500}
.rlist .y{color:var(--good)}.rlist .n{color:var(--bad)}
.rlist p{margin:8px 0 0;color:var(--ink2);font-size:.95rem}

/* profile */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.78rem;color:var(--ink2)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--surface2);display:flex;flex-direction:column;gap:2px}
.badge b{font-family:var(--f-display);font-weight:400}
.badge span{font-size:.82rem;color:var(--ink2)}
.badge.off{opacity:.55;border-style:dashed}
.badge.on{border-color:var(--sun)}
.ibar{display:flex;flex-direction:column;gap:8px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:10px;align-items:center;font-size:.92rem}
.irow .track{margin:0;height:8px}
.irow .track i{background:var(--ic)}
.irow em{font-style:normal;text-align:end;font-variant-numeric:tabular-nums;color:var(--ink2)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.toggle{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 14px;font-weight:700}
.toggle[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.danger{border-color:var(--bad);color:var(--bad);background:transparent}


/* visual lab */
#viz .scrim{z-index:50}
.vlab{margin-top:10px;padding:12px 14px;background:var(--surface);border:2px dashed var(--ic);border-radius:16px;display:flex;flex-direction:column;gap:6px}
.vlab b{font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.vlh{font-size:.85rem;color:var(--ink2)}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.vchip{border:2px solid var(--ic);background:var(--surface2);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.vform{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.vfield{display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--ink2);min-width:0;flex:1 1 140px}
.vfield input,.vfield select,.vsp{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.vsp{width:auto;padding:6px 8px}
.vspd{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink2);margin-inline-start:auto}
.vstage{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto;min-height:150px}
.vcap{min-height:3.2em;font-weight:500}
.vctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vctl .btn{padding:10px 14px}
#vslider{width:100%;accent-color:var(--brand)}
.vcount{text-align:center;font-family:var(--f-code);font-size:.85rem;color:var(--ink2)}
.vrow{display:flex;gap:8px;align-items:flex-start;margin-block:6px}
.vname{flex:none;min-width:4.6em;font-size:.8rem;color:var(--ink2);padding-top:6px}
.vcells{display:flex;gap:4px}
.vcw{text-align:center;width:36px;flex:none}
.vc{height:36px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-family:var(--f-code);font-weight:700;background:var(--surface);color:var(--ink)}
.vc.cur{border-color:var(--sun);background:var(--sun);color:var(--sun-ink)}
.vc.ok{border-color:var(--good);background:var(--good);color:var(--brand-ink)}
.vc.no{border-color:var(--bad);background:var(--bad);color:var(--brand-ink)}
.vc.hi{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.vc.dim{opacity:.4}
.vc.sp{visibility:hidden}
.vcells.sm .vcw{width:26px}.vcells.sm .vc{height:28px;font-size:.78rem}
.vi{font-size:.68rem;color:var(--ink2);min-height:1em}
.vp{font-size:.7rem;font-weight:700;color:var(--brand);min-height:1em;white-space:nowrap}
.vinfo{margin-top:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:.9rem}
.vt{border-collapse:collapse;font-family:var(--f-code);font-size:.85rem;margin-block:4px}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px;text-align:center;min-width:30px;color:var(--ink)}
.vt th{background:var(--surface);color:var(--ink2);font-weight:500}
.vt td.cur{background:var(--sun);color:var(--sun-ink)}
.vt td.hi{background:var(--surface);}
.vt td.ok{background:var(--good);color:var(--brand-ink)}
.vt td.dep{background:var(--brand);color:var(--brand-ink)}
.vt tr.curr th,.vt tr.curr td{background:var(--sun);color:var(--sun-ink)}
.vtwo{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:8px}
.vlist{font-family:var(--f-code);font-size:.85rem;line-height:1.7;direction:ltr;text-align:left}
.vlog{font-family:var(--f-code);font-size:.85rem;direction:ltr;text-align:left;display:flex;flex-direction:column;gap:2px}
.vl{padding-block:2px;color:var(--ink2)}
.vl.cur{color:var(--ink);font-weight:700;background:var(--surface);border-radius:6px;outline:2px solid var(--sun)}
.vl.res{color:var(--ink)}
.vlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin-top:6px;font-family:var(--f-code)}
.vlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px}
.vbar{display:flex;height:34px;border:2px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px;direction:ltr}
.vseg{display:grid;place-items:center;color:var(--brand-ink);font-weight:700;min-width:0}
.vseg.empty{background:var(--surface);color:var(--ink2)}
.vtreewrap{overflow-x:auto;margin-bottom:8px}
.gsvg{display:block;width:100%;max-width:440px;height:auto;margin-inline:auto}
.gsvg.tree{max-width:none;margin-inline:0}
.gsvg text{font-family:var(--f-code);font-size:13px;font-weight:700;fill:var(--ink)}
.gsvg .gw{font-size:11px;fill:var(--ink2)}

    view(B("צובעים את ("+r+","+c+"). נוספו "+add+" שכנים חדשים בצבע "+old+" לתור.","Recolour ("+r+","+c+"). "+add+" new neighbours of colour "+old+" join the queue."));
  }
  F.push(fr(B("הסתיים: כל האזור המחובר נצבע. זמן O(שורות × עמודות). חשוב לטפל במקרה שבו הצבע החדש שווה לישן.","Done: the whole connected region is recoloured. O(rows × cols). Handle the case where the new colour equals the old one."),F[F.length-1].h));

function gPerim(){
  var g=[[0,1,0,0],[1,1,1,0],[0,1,0,0],[1,1,0,0]],F=[],cls={},tot=0,rl=["0","1","2","3"],cl=["0","1","2","3"];
  function view(msg){F.push(fr(msg,gridHTML(rl,cl,g.map(function(r,i){return r.map(function(v,j){return {t:v,c:cls[i+","+j]||""}})}))+vinfo(B("היקף עד כה: ","perimeter so far: ")+'<b>'+tot+'</b>')))}
  view(B("1 = יבשה. כל תא יבשה בודד מוסיף 4 צלעות, אבל כל צלע משותפת לשני תאי יבשה אינה חלק מההיקף.","1 = land. Each land cell adds 4 sides, but a side shared by two land cells is not part of the perimeter."));

function mergeStates(a,b){
  var r=Object.assign(fresh(),a),i,k;
  r.xp=Math.max(a.xp||0,b.xp||0);r.best=Math.max(a.best||0,b.best||0);r.exam=Math.max(a.exam||0,b.exam||0);r.cleared=Math.max(a.cleared||0,b.cleared||0);
  if((b.last||"")>(a.last||"")){r.streak=b.streak||0;r.last=b.last;r.freezes=b.freezes}
  r.guideSeen=(a.guideSeen||b.guideSeen)?1:0;
  ["lc","learned","badges","boss","daily","vz","openDone"].forEach(function(key){r[key]=Object.assign({},b[key]||{},a[key]||{})});
  r.ans=Object.assign({},b.ans||{});
  Object.keys(a.ans||{}).forEach(function(id){var x=a.ans[id],y=r.ans[id];
    if(!y){r.ans[id]=x;return}
    if(x.ok&&!y.ok)r.ans[id]=x;else if(x.ok===y.ok&&(x.first&&!y.first||(x.first===y.first&&(x.tries||0)>(y.tries||0))))r.ans[id]=x});
  ["think","retry"].forEach(function(key){r[key]=Object.assign({},b[key]||{});Object.keys(a[key]||{}).forEach(function(n){var x=a[key][n],y=r[key][n];if(!y||(x.skip&&!y.skip)||(!y.skip&&x.s&&y.s&&x.s<y.s))r[key][n]=x})});
  r.open=JSON.parse(JSON.stringify(b.open||{}));
  Object.keys(a.open||{}).forEach(function(q){r.open[q]=r.open[q]||{};Object.keys(a.open[q]).forEach(function(p){var x=a.open[q][p],y=r.open[q][p];

}

/* ---------- quiz ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function startQuiz(mode,ids,o){
  o=o||{};V.sheet=null;V.profile=false;V.res=null;
  V.quiz={mode:mode,ids:ids,i:0,sel:[],checked:false,last:null,res:[],left:o.time||0,need:o.need||0,w:o.w||null,fb:(mode!=="boss"&&mode!=="exam")};
  if(timerId)clearInterval(timerId);
  if(V.quiz.left){timerId=setInterval(function(){
    if(!V.quiz){clearInterval(timerId);return}
    V.quiz.left--;var el=document.getElementById("timer");if(el)el.textContent=fmt(V.quiz.left);
    if(V.quiz.left<=0){clearInterval(timerId);finish(true)}},1000)}
  window.scrollTo(0,0);render();
}
function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)}
function cur(){return MCQ[V.quiz.ids[V.quiz.i]]}
function record(q,correct,mode){
  var a=S.ans[q.id]=S.ans[q.id]||{tries:0,first:false,ok:false,due:null},gain=0;
  a.tries++;if(a.tries===1)a.first=correct;
  if(correct){if(!a.ok){gain=a.tries===1?10:5;a.ok=true}if(mode==="review"){if(a.due&&a.due<=Date.now())S.cleared++;a.due=null}}
  else a.due=Date.now()+DAY;
  touch();return gain;
}
function check(){
  var Q=V.quiz,q=cur();if(Q.checked)return;
  var sel=Q.sel.slice().sort().join(","),ans=q.answer.slice().sort().join(","),ok=sel===ans;
  var gain=record(q,ok,Q.mode);
  if(Q.mode==="daily"&&ok&&!S.daily[today()]){S.daily[today()]=1;gain+=20}
  addXP(gain);Q.checked=true;Q.last={ok:ok,gain:gain};
  tone(ok?740:220,.14);
  save();checkBadges();save();
  if(!Q.fb){Q.res.push({id:q.id,ok:ok});advance();return}
  render();
}
function advance(){
  var Q=V.quiz;Q.i++;Q.sel=[];Q.checked=false;Q.last=null;
  if(Q.i>=Q.ids.length){finish(false);return}
  window.scrollTo(0,0);render();
}
function next(){var Q=V.quiz;if(Q.fb&&Q.last)Q.res.push({id:cur().id,ok:Q.last.ok});advance()}
function retry(){var Q=V.quiz;Q.checked=false;Q.sel=[];Q.last=null;render()}
function finish(timeUp){
  var Q=V.quiz;if(timerId)clearInterval(timerId);
  var q;while(Q.res.length<Q.ids.length){q=MCQ[Q.ids[Q.res.length]];Q.res.push({id:q.id,ok:false})}
  var n=Q.ids.length,c=Q.res.filter(function(r){return r.ok}).length,pass=true,bonus=0,score=Math.round(c/n*100);
  if(Q.mode==="boss"){pass=c>=Q.need;if(pass){bonus=S.boss[Q.w]?20:50;S.boss[Q.w]=today()}}
  if(Q.mode==="exam"){bonus=c*3;pass=score>=70;S.exam=Math.max(S.exam,score)}
  addXP(bonus);touch();
  V.res={mode:Q.mode,n:n,c:c,pass:pass,bonus:bonus,score:score,list:Q.res,w:Q.w,timeUp:!!timeUp};V.quiz=null;
  save();checkBadges();save();
  if(pass&&(Q.mode==="boss"||Q.mode==="exam")){confetti();tone(880,.2)}
  window.scrollTo(0,0);render();
}
function optLabel(i){return "אבגדהו"[i]||String(i+1)}
function quizHTML(){
  var Q=V.quiz,q=cur(),n=Q.ids.length,last=Q.last;
  var dots=Q.ids.map(function(id,i){var r=Q.res[i];return '<i class="'+(r?(r.ok?"ok":"no"):(i===Q.i?"cur":""))+'"></i>'}).join("");
  var h='<div class="wrap"><div class="qtop"><button class="xbtn" data-act="quit" aria-label="'+esc(t("back"))+'">✕</button><div class="dots" role="img" aria-label="'+esc(t("qN")(Q.i+1,n))+'">'+dots+'</div>'+(Q.left||Q.mode==="boss"||Q.mode==="exam"?'<div class="timer" id="timer">'+fmt(Q.left)+'</div>':"")+'</div>';
  var tl=q.type==="tf"?t("tf"):q.type==="multi"?t("multi"):t("single");
  h+='<div class="qcard"><div class="qmeta"><span class="chip">'+esc(t("qN")(Q.i+1,n))+'</span><span class="chip">'+esc(tl)+'</span>'+(q.basis==="derived"?'<span class="chip draft">'+esc(t("draft"))+'</span>':"")+'<span class="chip">'+esc(loc(NODES[q.node].title))+'</span></div>';
  h+='<p class="stem">'+esc(loc(q.stem))+'</p><div class="opts" role="'+(q.type==="multi"?"group":"radiogroup")+'">';
  q.options.forEach(function(o,i){
    var cls="opt",selOn=Q.sel.indexOf(i)>-1;
    if(Q.checked&&Q.fb){if(q.answer.indexOf(i)>-1)cls+=" right";else if(selOn)cls+=" wrong"}
    else if(selOn)cls+=" sel";
    h+='<button class="'+cls+'" data-act="opt" data-i="'+i+'"'+(Q.checked?" disabled":"")+' role="'+(q.type==="multi"?"checkbox":"radio")+'" aria-checked="'+selOn+'"><span class="k">'+(q.type==="tf"?(i===0?"✓":"✕"):optLabel(i))+'</span><span class="tx">'+esc(loc(o))+'</span></button>';
  });
  h+='</div>';
  if(Q.checked&&Q.fb&&last){
    h+='<div class="fb '+(last.ok?"ok":"no")+'">'+(last.gain?'<span class="gain">+'+last.gain+' '+t("xp")+'</span>':"")+'<h3>'+esc(last.ok?t("right"):t("wrong"))+'</h3><p>'+esc(loc(q.explanation))+'</p></div>';
    h+='<div class="actions">'+(!last.ok?'<button class="btn ghost" data-act="retry">'+esc(t("retry"))+'</button>':"")+'<button class="btn" data-act="next">'+esc(Q.i===n-1?t("finish"):t("next"))+'</button></div>';
  }else if(q.type==="multi"){
    h+='<div class="actions"><button class="btn" data-act="check"'+(Q.sel.length?"":" disabled")+'>'+esc(t("check"))+'</button></div>';
  }
  return h+'</div></div>';
}
function resHTML(){
  var R=V.res,title,sub="";
  if(R.mode==="boss"){title=R.pass?t("bossWin"):t("bossLose")}
  else if(R.mode==="exam"){title=t("examDone")}
  else title=t("finish");
  if(R.timeUp)sub=t("times");
  var h='<div class="wrap"><div class="res"><h1>'+esc(title)+'</h1>'+(sub?'<p class="chip">'+esc(sub)+'</p>':"")+'<div class="big">'+R.c+'/'+R.n+'</div><p>'+esc(t("correct"))+(R.mode==="exam"?' · '+esc(t("score"))+' '+R.score:"")+(R.bonus?' · '+esc(t("bonus"))+' +'+R.bonus+' '+t("xp"):"")+'</p>';
  h+='<div class="rlist">'+R.list.map(function(r){var q=MCQ[r.id];return '<details><summary><span class="'+(r.ok?"y":"n")+'">'+(r.ok?"✓":"✕")+'</span> '+esc(loc(q.stem).slice(0,90))+'…</summary><p>'+esc(loc(q.explanation))+'</p></details>'}).join("")+'</div>';
  h+='<div class="actions" style="justify-content:center"><button class="btn" data-act="home">'+esc(t("back"))+'</button></div></div></div>';
  return h;
}

/* ---------- profile ---------- */
function profileHTML(){
  var lv=level(S.xp),st=stats();
  var h='<div class="scrim" data-act="closeProfile"><div class="sheet modal" data-stop="1" role="dialog" aria-modal="true" aria-label="'+esc(t("profile"))+'"><div class="shead"><span class="core2" style="--ic:var(--brand)">'+lv+'</span><div><h2>'+esc(t("profile"))+'</h2><div class="chip" style="margin-top:4px">'+esc(lvlName(lv))+'</div></div><button class="xbtn" data-act="closeProfile" id="sx" aria-label="close">✕</button></div><div class="sbody">';
  h+='<div class="stats"><div><b>'+S.xp+'</b><span>'+esc(t("xp"))+'</span></div><div><b>'+(S.streak||0)+'</b><span>'+esc(t("days"))+'</span></div><div><b>'+(S.best||0)+'</b><span>'+esc(t("bestStreak"))+'</span></div><div><b>'+st.ok+'/'+D.mcq.questions.length+'</b><span>'+esc(t("solvedQ"))+'</span></div><div><b>'+Object.keys(S.lc).length+'/'+D.lc.questions.length+'</b><span>'+esc(t("lcDone"))+'</span></div><div><b>'+Object.keys(S.boss).length+'</b><span>'+esc(t("boss"))+'</span></div></div>';
  h+='<div class="sub">'+esc(t("islands"))+'</div><div class="ibar">'+ORDER.map(function(w){var ids=islandIds(w),d=0,tt=0;ids.forEach(function(id){var f=info(id);d+=f.done;tt+=f.total});var p=Math.round(d/tt*100);return '<div class="irow" style="--ic:var('+COL[WK[w].color]+')"><span>'+esc(loc(WK[w].title))+'</span><div class="track"><i style="width:'+p+'%"></i></div><em>'+p+'%</em></div>'}).join("")+'</div>';
  h+=accountHTML();
  h+='<div class="sub">'+esc(t("badges"))+'</div><div class="badges">'+BADGES.map(function(b){var on=!!S.badges[b.id];return '<div class="badge '+(on?"on":"off")+'"><b>'+esc(b[L()][0])+'</b><span>'+esc(b[L()][1])+'</span></div>'}).join("")+'</div>';
  h+='<div class="sub">'+esc(t("settings"))+'</div><div class="row2"><button class="toggle" data-act="lang" aria-pressed="false">'+(L()==="he"?"English":"עברית")+'</button><button class="toggle" data-act="sound" aria-pressed="'+!!S.set.sound+'">'+esc(t("sound"))+'</button><button class="toggle danger" data-act="reset">'+esc(V.confirmReset?t("resetSure"):t("reset"))+'</button></div></div></div></div>';
  return h;
}

/* ---------- render + events ---------- */
function render(){
  var keep=null,had=false,sb=document.querySelector(".scrim .sbody");if(sb){keep=sb.scrollTop;had=true}
  var dir=L()==="he"?"rtl":"ltr";app.setAttribute("dir",dir);document.documentElement.lang=L();
  var h=V.quiz?quizHTML():V.res?resHTML():mapHTML();
  if(!V.quiz&&!V.res){if(V.sheet)h+=sheetHTML(V.sheet);if(V.profile)h+=profileHTML()}
  app.innerHTML=h;
  var nb=document.querySelector(".scrim .sbody");if(nb&&keep!=null)nb.scrollTop=keep;
  if(!had){var x=document.getElementById("sx");if(x)x.focus()}
}
app.addEventListener("click",function(e){
  var lk=e.target.closest("[data-lock]");
  if(lk){var ln=lk.getAttribute("data-lock");if(!thinkOK(ln)){var nw=Date.now();if(!PEND[ln]||nw-PEND[ln]>8000){e.preventDefault();e.stopPropagation();PEND[ln]=nw;toast(B("קודם 30 דקות חשיבה לבד. לחצו שוב תוך כמה שניות כדי לפתוח בכל זאת.","Think on your own for 30 minutes first. Tap again within seconds to open anyway."));return}delete PEND[ln]}}
  var lk2=e.target.closest("[data-lock2]");
  if(lk2){var l2=lk2.getAttribute("data-lock2");if(!retryOK(l2)){var n2=Date.now(),key2="r"+l2;if(!PEND[key2]||n2-PEND[key2]>8000){e.preventDefault();e.stopPropagation();PEND[key2]=n2;toast(thinkOK(l2)?B("קודם צפו בסרטון ונסו שוב. לחצו שוב תוך כמה שניות כדי לפתוח בכל זאת.","Watch the video and try again first. Tap again within seconds to open anyway."):B("קודם 30 דקות חשיבה, סרטון וניסיון נוסף. לחצו שוב כדי לפתוח בכל זאת.","First 30 minutes of thinking, the video and another try. Tap again to open anyway."));return}delete PEND[key2]}}
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act");
  if((act==="closeSheet"||act==="closeProfile")&&e.target.closest("[data-stop]")&&el.classList.contains("scrim"))return;
  if(act==="lc")return;
  var id=el.getAttribute("data-id");
  switch(act){
   case "node":V.sheet=id;render();break;
   case "viz":vizOpen(el.getAttribute("data-k"),id);break;
   case "guide":openGuide();break;
   case "cloud-in":if(window.CloudBackend)window.CloudBackend.signIn().catch(function(e){CL.err=String(e&&e.message||e);toast(B("ההתחברות נכשלה: ","Sign-in failed: ")+CL.err)});break;
   case "cloud-out":if(window.CloudBackend)cloudPush().then(function(){return window.CloudBackend.signOut()}).then(function(){CL.user=null;render()});break;
   case "cloud-sync":cloudPull();break;
   case "openlist":openOList(null);break;
   case "openq-node":openOList(el.getAttribute("data-id"));break;
   case "ai":openAI(el.getAttribute("data-n"));break;
   case "tstart":S.think[el.getAttribute("data-n")]={s:Date.now()};save();toast(B("הטיימר התחיל. בהצלחה!","Timer started. Good luck!"));render();break;
   case "rstart":S.retry[el.getAttribute("data-n")]={s:Date.now()};save();toast(B("בהצלחה בניסיון השני!","Good luck on the second try!"));render();break;
   case "rskip":{var rn=el.getAttribute("data-n");S.retry[rn]=Object.assign(S.retry[rn]||{s:Date.now()},{skip:1});save();render();break}
   case "tskip":{var tn=el.getAttribute("data-n");S.think[tn]=Object.assign(S.think[tn]||{s:Date.now()},{skip:1});save();render();break}
   case "closeSheet":V.sheet=null;render();break;
   case "profile":V.profile=true;V.confirmReset=false;render();break;
   case "closeProfile":V.profile=false;render();break;
   case "practice":startQuiz("practice",shuffle(info(id).qs.map(function(q){return q.id})));break;
   case "daily":startQuiz("daily",[dailyQ().id]);break;
   case "review":startQuiz("review",shuffle(dueIds()).slice(0,8));break;
   case "exam":startQuiz("exam",shuffle(D.mcq.questions.map(function(q){return q.id})).slice(0,12),{time:900});break;
   case "boss":{var w=el.getAttribute("data-w"),qs=islandQs(w);
     if(qs.length<3){toast(t("bossNo"));break}
     var ids=shuffle(qs.map(function(q){return q.id})).slice(0,5),n=ids.length,need=n>=5?4:Math.max(2,n-1);
     startQuiz("boss",ids,{time:n*45,need:need,w:w});toast(t("bossIntro")(n,need));break}
   case "cont":{var nx=nextStop();if(nx){var w2=NODES[nx].week,node=document.querySelector('[data-id="'+nx+'"]');if(node)node.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"center"});setTimeout(function(){V.sheet=nx;render()},reduced()?0:450)}break}
   case "opt":{var Q=V.quiz;if(Q.checked)break;var i=+el.getAttribute("data-i"),q=cur();
     if(q.type==="multi"){var p=Q.sel.indexOf(i);if(p>-1)Q.sel.splice(p,1);else Q.sel.push(i);render()}
     else{Q.sel=[i];check()}break}
   case "check":check();break;
   case "next":next();break;
   case "retry":retry();break;
   case "quit":if(timerId)clearInterval(timerId);V.quiz=null;render();break;
   case "home":V.res=null;render();break;
   case "learn":S.learned[id]=S.learned[id]?0:1;if(S.learned[id]){addXP(15);touch();tone(740,.12);confetti()}save();checkBadges();save();render();break;
   case "lang":S.set.lang=L()==="he"?"en":"he";save();render();vizRefresh();break;
   case "sound":S.set.sound=!S.set.sound;save();render();if(S.set.sound)tone(660,.1);break;
   case "reset":if(V.confirmReset){S=fresh();V.confirmReset=false;V.profile=false;save()}else V.confirmReset=true;render();break;
  }
});
app.addEventListener("change",function(e){
  var el=e.target;if(el.getAttribute("data-act")!=="lc")return;
  var n=el.getAttribute("data-n");
  if(el.checked){if(!S.lc[n]){S.lc[n]=1;addXP(15);touch();tone(740,.12)}}else{delete S.lc[n]}
  save();checkBadges();save();render();
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(VZ){vizClose();return}if(V.profile){V.profile=false;render()}else if(V.sheet){V.sheet=null;render()}}});
render();
if(!S.guideSeen)setTimeout(openGuide,350);
})();
</script>

<script>
/* Firebase adapter: loaded only when config.js defines window.FIREBASE_CONFIG */
(function(){
  var cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey)return;
  var V="10.12.2",B="https://www.gstatic.com/firebasejs/"+V+"/";
  Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]).then(function(m){
    var app=m[0].initializeApp(cfg),auth=m[1].getAuth(app),db=m[2].getFirestore(app),A=m[1],F=m[2];
    function shape(u){return u?{uid:u.uid,email:u.email||"",name:u.displayName||""}:null}
    window.CloudBackend={
      signIn:function(){var p=new A.GoogleAuthProvider();if(cfg.allowedDomain)p.setCustomParameters({hd:cfg.allowedDomain});return A.signInWithPopup(auth,p).then(function(r){
        if(cfg.allowedDomain&&!String(r.user.email||"").toLowerCase().endsWith("@"+cfg.allowedDomain)){return A.signOut(auth).then(function(){throw new Error("Use your @"+cfg.allowedDomain+" account")})}})},
      signOut:function(){return A.signOut(auth)},
      load:function(u){return F.getDoc(F.doc(db,"users",u.uid)).then(function(d){return d.exists()?d.data():null})},
      save:function(u,payload){var d=Object.assign({},payload,{name:u.name,email:u.email,updatedAt:F.serverTimestamp()});return F.setDoc(F.doc(db,"users",u.uid),d)}
    };
    A.onAuthStateChanged(auth,function(u){if(window.__onUser)window.__onUser(shape(u))});
    if(window.__renderAgain)window.__renderAgain();
  }).catch(function(e){console.warn("Firebase failed to load",e)});
})();
</script>
